<!DOCTYPE html>
<html>
<head>
<title>Help</title>

<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<script type="text/javascript" src="/common/firebug-lite/build/firebug-lite.js">
</script>
<link rel="stylesheet" href="/common/monocore-3.2.0.css" />
<link rel="stylesheet" href="/common/monoctrl-3.2.0.css" />
<script src="/common/jquery-1.9.1.min.js"></script>
<script src="/common/monocore-3.2.0.js"></script>
<script src="/common/monoctrl-3.2.0.js"></script>
<style type="text/css">
#reader {
    width: 100%;
    height: 600px;
    border: 1px solid black;
    margin: 0 auto;
    background: white;
}
.runner {
    font-variant: small-caps;
    font-size: 87%;
    color: #900;
}
.bookTitle {
    position: absolute;
    top: 0%;
    width: 100%;
    text-align: center;
    cursor: pointer;
}

</style>

<script type="text/javascript">
	function resizeFrame() {
    	var h = $(window).height();
    	$("#reader").css('height',h - 20);
	}

	// This adds the book title to the top of each page.
	function createBookTitle(reader, contactListeners) {
	    var bt = {}
	    bt.createControlElements = function () {
	        cntr = document.createElement('div');
	        cntr.className = "bookTitle";
	        runner = document.createElement('div');
	        runner.className = "runner";
	        runner.innerHTML = reader.getBook().getMetaData('title');
	        cntr.appendChild(runner);
	        if (contactListeners) {
	            Monocle.Events.listenForContact(cntr, contactListeners);
	        }
	        return cntr;
	    }
	    reader.addControl(bt, 'page');
	    return bt;
	}
	
	var bookData = {
		getComponents: function () {
			return [
					'main',
					'section_01',
					'section_02',
					'section_03'
				];
		},
		getContents: function () {
			return [
				{title: "首页", src: 'main',
					children: [ 
								{title: "简介", src: 'main#heading_id_1'},
								{src: 'main#heading_id_2' , title: "诊断仪简介"}
					          ]
				},
				{title: "启动画面介绍", src: 'section_01',
					children: [ 
								{title: "起始画面", src: 'section_01#heading_id_2'},
								{src: 'section_01#heading_id_3' , title: "工具栏介绍"},
								{src: 'section_01#heading_id_4' , title: "诊断模式介绍"}
					          ]
				},
				{title: "诊断功能介绍", src: 'section_02',
					children: [ 
								{title: "诊断功能概述", src: 'section_02#heading_id_1'},
								{title: "车辆信息功能介绍", src: 'section_02#heading_id_2'},
								{title: "故障码功能介绍", src: 'section_02#heading_id_3'},
								{title: "数据流功能介绍", src: 'section_02#heading_id_4'},
								{title: "执行器测试功能介绍", src: 'section_02#heading_id_5'},
								{title: "配置功能介绍", src: 'section_02#heading_id_6'},
								{title: "特殊功能介绍", src: 'section_02#heading_id_7'},
								{title: "刷写功能介绍", src: 'section_02#heading_id_8'},
								{title: "测试报告功能介绍", src: 'section_02#heading_id_11'}
					      		]
				},
				{title: "支持", src: 'section_03',
					children: [ 
							{title: "支持", src: 'section_03#heading_id_1'}
				          ]
				}
			]
		},
		getComponent: function (componentId) {
			var compUrl = "Text/" + componentId + '.xhtml';
			return {url:compUrl};
		},
		getMetaData: function(key) {
			return {
				title: "帮助",
				creator: "William Wang"
				}[key];
		}
	}
			
	Monocle.Events.listen(
		window,
		'load',
		function () {
			$(window).resize(resizeFrame).resize();
            window.reader = Monocle.Reader('reader', bookData, { flipper: Monocle.Flippers.Slider, panels: Monocle.Panels.Magic }, 
	            function (reader) {
	                var stencil = new Monocle.Controls.Stencil(reader);  // Make internal links work.
	                reader.addControl(stencil);
	                var toc = Monocle.Controls.Contents(reader);         // Add a table of contents.
	                reader.addControl(toc, 'popover', { hidden: true });
	                createBookTitle(reader, { start: function () { reader.showControl(toc); } });
	            }
			);
		}
	);
</script>

</head>
<body>
	<div id="reader"><img id="busy" alt="busy" src="/spinner.gif" /></div>
</body>
</html>
