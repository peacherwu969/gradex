<!DOCTYPE html>
<html>
<head>
<title>Input Confirm</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>


<body>
	<div data-role="page" id="mainPage" unselectable="on" onselectstart="return false;" style="-moz-user-select:none; -webkit-user-select:none; -ms-user-select:none; user-select:none;">


		<div data-role="header">
			<h1 id="title"></h1>
		</div>
		<div data-role="content">
			<br/><br/><br/><br/><br/><br/>
			<br/><br/><br/><br/><br/><br/>
			<fieldset class="ui-grid-c">
					<div class="ui-block-a"></div>
					<div class="ui-block-b"><button id="response_Auto" data-corners="true" data-mini="false" data-icon="gear" data-iconpos="left"><@gx_translate text_id="SAIC_LDV_EV79_UI.MESSAGE.AUTOHEALTHTEST" /></button></div>
					<div class="ui-block-c"><button id="response_Manu" data-corners="true" data-mini="false" data-icon="grid" data-iconpos="left"><@gx_translate text_id="SAIC_LDV_EV79_UI.MESSAGE.MANUALHEALTHTEST" /></button></div>
			</fieldset>
		</div>
		<div data-role="footer" data-theme="c" data-position="fixed">
			<div>
					<fieldset class="ui-grid-c">
						<div class="ui-block-a"></div>
						<div class="ui-block-b"></div>
						<div class="ui-block-c"></div>
						<div class="ui-block-d"><button id="response_back" data-corners="true" data-mini="false" data-icon="back" data-iconpos="right" ><@gx_translate text_id="GX.COMMON.BACK" /></button></div>
					</fieldset>
			</div>
		</div>
		
		<script type="text/javascript">

			// setup up screen for initial display

			$('#mainPage').bind('pageshow', function()
				{

					$(document).on("swipeleft", "#mainPage", function(e)
					{
						if ($.mobile.activePage.jqmData("panel") !== "open")
						{
							if (e.type === "swipeleft")
							{
								$("#testPanel").panel("open");
							}
						}
					});

					title = OTX.hmi.getArgument('title');

					$('#title').text(title);

				});

				$("#response_Auto").click(function(e)
				{
					
					OTX.hmi.valueChangedInPage('result', '1');
					OTX.hmi.closeScreen();			    					
			    
				});

				$("#response_Manu").click(function(e)
				{
					OTX.hmi.valueChangedInPage('result', '2')
					OTX.hmi.closeScreen();
				});
				
				$("#response_back").click(function(e)
				{
					OTX.hmi.valueChangedInPage('back', 'true')
					OTX.hmi.closeScreen();
				});
		</script>
	</div>
</body>
</html>
