<!DOCTYPE html>
<html>
<head>
<title>Dynamic Screen Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<link rel="stylesheet" href="common/nv.d3.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script type="text/javascript" src="common/d3.min.js"></script>
<script type="text/javascript" src="common/barChart.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>

<body>
	<div data-role="page" id="mainPage">
		<script type="text/javascript" src="js/index.js"></script>
		<style scoped>
		#flashdata
		{
			height:110px;
			font-size:20px;
			text-align:left;
			overflow:hidden;
		}
		</style>
		<!--<div data-role="panel" id="testPanel" data-position="right" data-display="overlay">
			<ul data-role="listview">
				<li data-role="divider" data-iconpos="notext" data-theme="e">Actions</li>
				<li data-icon="delete" id="testAbort"><a href="#">Abort</a></li>
				<li data-icon="back" data-rel="close"><a href="#mainPage">Back to test</a></li>
			</ul>
		</div><!-- /panel -->
		
		<div data-role="header" id="flashMenuName"></div>
			<!--<a class="ui-icon-nodisc ui-btn-right" href="#testPanel" data-role="button" data-icon="bars" data-iconpos="notext" data-iconshadow="false" data-inline="true">Actions</a>-->
			<!--<h1><@gx_translate text_id="SAIC_LDV_EV79_UI.MESSAGE.ECUFLASHING" /></h1>-->

		<div data-role="content">
			<p style="font-size:24px;"><@gx_translate text_id="SAIC_LDV_EV79_UI.MESSAGE.FINISHPERCENT" />: <span id="quantityPlaceholder">---</span></p>
			<div id='chartBarContainer'></div>
			<label id="message" style="font-size:24px"></label><br>
			<div data-role="content" id="flashdata"></div>
		</div>

		<script type="text/javascript">

			var barChart;
			var index = 0x01;

			// SingleBarCharts are a custom component - this shows how to create them

			function createBarCharts(label, scaleMin, scaleMax, scaleOrigin, ticks)
			{
				var config =
				{
					label: label,
					scaleMin: scaleMin,
					scaleMax: scaleMax,
					origin : scaleOrigin,
					ticks: ticks,
					orientation: "horizontal",
					height: 80,
					width: 600,
					transitionTime: 100,
				}

				barChart = new SingleBarChart("chartBarContainer", config);
				barChart.render(scaleOrigin);

                // increase the font size for the parameter name - should be controlled by style sheet

				var label = d3.selectAll(".label");
				label.attr("style", "font-size:24px;");
			}
			
			function byteToString(arr) {
				if(typeof arr === 'string') {
					return arr;
				}
				var str = '',
					_arr = arr;
				for(var i = 0; i < _arr.length; i++) {
					var one = _arr[i].toString(2),
						v = one.match(/^1+?(?=0)/);
					if(v && one.length == 8) {
						var bytesLength = v[0].length;
						var store = _arr[i].toString(2).slice(7 - bytesLength);
						for(var st = 1; st < bytesLength; st++) {
							store += _arr[st + i].toString(2).slice(2);
						}
						str += String.fromCharCode(parseInt(store, 2));
						i += bytesLength - 1;
					} else {
						str += String.fromCharCode(_arr[i]);
					}
				}
				return str;
			}
			
			// setup up bar chart for initial display

			$('#mainPage').bind('pagebeforecreate', function(e, data)
				{
					flashMenuName = OTX.hmi.getArgument('flashMenuName');
					if(flashMenuName == '' || typeof(flashMenuName) == 'undefined'){
						$('#flashMenuName').append('<h1><@gx_translate text_id="SAIC_LDV_EV79_UI.MESSAGE.ECUFLASHING" /></h1>');
					}
					else{
						$('#flashMenuName').append('<p style="font-size:15px;text-align:center;">'+flashMenuName+'</p>');
					}
					label = OTX.hmi.getArgument('label');
					scaleMin = OTX.hmi.getArgument('scaleMin').value;
					scaleMax = OTX.hmi.getArgument('scaleMax').value;
					scaleOrigin = OTX.hmi.getArgument('scaleOrigin').value;
					ticks = OTX.hmi.getArgument('ticks');
					createBarCharts(label, scaleMin, scaleMax, scaleOrigin, ticks);
				});

			
			
			$('#mainPage').bind('pagebeforeshow', function(e, data)
				{
					refreshflashdata();
				});
			
			// add a listener to get called when the "value" variable changes - updates the text and bar chart
			// note - it is also possible to construct a polled version to refresh the data at a fixed cadence

			OTX.hmi.addValueListener('value', function(quantity)
				{
					var tempValue = quantity.value;
					if (parseInt(tempValue, 10) !== tempValue) 
					{
					 
						tempValue = tempValue.toFixed(2);
					}
					$('#quantityPlaceholder').text(tempValue + ' ' + quantity.unit);
					barChart.updateBarChart(tempValue);
				});
				
			OTX.hmi.addValueListener('message', function(string)
				{
					$('#message').text(string);
				});

			function refreshflashdata()
			{
				setInterval(function(){
					OTX.hmi.getParameterValue('flashdata' ,function(bytefield){
						//daatoutput = byteToString(bytefield)
						if(bytefield ==='')
						{
							return;
						}
						else
						{
							$('#flashdata').prepend("<label>"+index.toString(16)+':'+byteToString(bytefield)+'</label><br>');
							if(index != 0xFF){
								index++;
							}
							else{
								index = 0x00;
							}
						}
					});
				},200);
			}



				//$("#testAbort").click(function(e)
				//{
				//	OTX.hmi.closeScreen();
				//});

		</script>
	</div>
</body>
</html>
