<!DOCTYPE html>
<html>
<head>
<title>EMS EDC17 Flash Progress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<link rel="stylesheet" href="common/nv.d3.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script type="text/javascript" src="common/d3.min.js"></script>
<script type="text/javascript" src="common/barChart.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>

<body>
	<div data-role="page" id="mainPage"> 
		
		<div data-role="header">
			<h1 id="title"></h1>
		</div>

		<div data-role="content">
			<h2 id="subtitle"></h2>
			<!-- <font color="#F00"><h4 id="notice"></h4></font> -->
			<h4 id="notice"></h4>
			<div><ul id="conditionList"></ul><div>
			<label id="message" style="font-size:24px"></label>
		</div>

		<script type="text/javascript">

			 
			$('#mainPage').bind('pagebeforecreate', function(e, data)
				{  
						notice = OTX.hmi.getArgument('notice');
						subtitle = OTX.hmi.getArgument('subtitle');
						title = OTX.hmi.getArgument('title'); 

						$('#title').text(title);
						$('#subtitle').text(subtitle);
						$('#notice').text(notice); 
				}); 
				
			OTX.hmi.addValueListener('message', function(string)
				{
					$('#message').text(string);
				}); 
				
				OTX.hmi.addValueListener('notice', function(string)
				{
					$('#notice').text(string);
				}); 

		</script>
	</div>
</body>
</html>
