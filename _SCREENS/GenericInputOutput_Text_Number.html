<!DOCTYPE html>
<html>

<head>
	<title>Input Confirm</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
	<link rel="stylesheet" href="busy.css" />
	<script src="common/jquery-1.9.1.min.js"></script>
	<script src="common/jquery.mobile-1.3.0.min.js"></script>
	<script src="common/js-url.min.js"></script>
	<script src="common/otx.js"></script>
	<meta http-equiv="X-UA-Compatible" content="IE=9" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="-1" />
</head>


<body>
	<div data-role="page" id="mainPage">


		<div data-role="header">
			<h1 id="title"></h1>
		</div>

		<div data-role="content">
			<h3 id="conditions_heading"></h3>
			<ul id="conditions"></ul>
			<h3 id="steps_heading"></h3>
			<ul id="steps"></ul>
			<input type="text" id="IOText" onkeyup="doKeyup(this)" />
			<br>
			<label id="inputNotice"></label>
			<label id="inputCharNumber"></label>
			<input type="hidden" id="message1" name="message1"
				value='<@gx_translate text_id="SAIC_LDV_EV79_UI.MESSAGE.THENUMBEROFCHARACTERSYOUINPUT" />' />
		</div>


		<div data-role="footer" data-theme="c" data-position="fixed">
			<div>
				<fieldset class="ui-grid-c">
					<div class="ui-block-a"></div>
					<div class="ui-block-b"><button id="response_yes" data-corners="true" data-mini="false"
							data-icon="check" data-iconpos="left">
							<@gx_translate text_id="GX.COMMON.YES" />
						</button></div>
					<div class="ui-block-c"><button id="response_no" data-corners="true" data-mini="false"
							data-icon="delete" data-iconpos="left">
							<@gx_translate text_id="GX.COMMON.CANCEL" />
						</button></div>
				</fieldset>
			</div>
		</div> <!-- footer -->

		<script type="text/javascript">

			//initial variable
			var reg;
			var regSelection = 0;
			var isNumber = false;
			var min;
			var max;

			var message = document.getElementById("message1").value;
			//set regular express

			function setRegExp() {
				switch (regSelection) {

					case 0://vin
						reg = /^[a-zA-Z0-9]{17}$/;
						break;
					case 1://security key
						reg = /^[a-zA-F0-9]{24}$/;
						break;
					case 2://PIN
						reg = /^[a-zA-F0-9]{8}$/;
						break;
					case 3://number with no decimal
						reg = /^(0|[1-9][0-9]*)$/;
						break;
					case 4://number with 2 decimals no negative
						reg = /^(0|[1-9][0-9]*)(\.\d{1,2})?$/;
						break;
					case 5://number with 2 decimals with negative
						reg = /^(\-)?(0|[1-9][0-9]*)(\.\d{1,2})?$/;
						break;
					case 6://Date
						reg = /^[0-9]{6}$/;
						break;
					case 7://BCD
						reg = /^[a-zA-F0-9]*$/;
						break;
					case 711://BCD
						reg = /^[A-Z0-9]*$/;
						break;
					case 8://
						reg = /^[a-zA-Z0-9]{8}$/;
						break;
					case 9://
						reg = /^[a-zA-Z0-9]{9}$/;
						break;
					case 10://PIN only number
						reg = /^[0-9]{0,10}$/;
						break;
					case 11://Part Number
						reg = /^[a-zA-Z0-9]{11}$/;
						break;
					case 12://
						reg = /^[a-zA-Z0-9]{12}$/;
						break;
					case 13://
						reg = /^[a-zA-Z0-9]{4}$/;
						break;
					case 16://Vehicle Feature Identification
						reg = /^[a-fA-F0-9]{16}$/;
						break;
					case 30://Battery Storage System Code
						reg = /^[a-zA-Z0-9]{30}$/;
						break;
					case 32://TBOX IP
						reg = /^[a-zA-Z0-9]{32}$/;
						break;
					case 34://Vehicle Feature Identification
						reg = /^[a-fA-F0-9]{34}$/;
						break;
					case 40://Vehicle Feature Identification
						reg = /^[a-fA-F0-9]{40}$/;
						break;
					case 64://Vehicle Feature Identification
						reg = /^[0-9A-Fa-f]{64}$/;
						break;
					case 66://Vehicle Feature Identification
						reg = /^[0-9]{66}$/;
						break;
					case 88://Vehicle Feature Identification
						reg = /^[0-9A-Fa-f]{88}$/;
						break;
					case 92://Date
						reg = /^[0-9]{92}$/;
						break;
					case 99://No Limit
						reg = /^([a-zA-Z0-9]+)$/;
						break;
					case 101://
						reg = /^[a-zA-Z0-9]{1}$/;
						break;
					case 102://
						reg = /^[a-zA-Z0-9]{2}$/;
						break;
					case 103://
						reg = /^[a-zA-Z0-9]{3}$/;
						break;
					case 104://
						reg = /^[a-zA-Z0-9]{4}$/;
						break;
					case 105://
						reg = /^[a-zA-Z0-9]{5}$/;
						break;
					case 200://
						reg = /^[a-zA-Z0-9]{200}$/;
						break;
					case 204://
						reg = /^[a-zA-Z0-9]{204}$/;
						break;
					case 208://
						reg = /^[a-zA-Z0-9]{208}$/;
						break;
					case 209://
						reg = /^[\w\W]*$/;
						var pattern = /^[-+]?[0-9]+(\.[0-9]+)?$/;
						break;
					case 210:
						reg = /^[-+]?[0-9]+(\.[0-9]+)?$/;
						break;
					default:
						break;
				}

			}

			//check input
			function isValidation() {
				var IOValue = $("#IOText").val();

				//displace the space
				IOValue = IOValue.replace(/[ ]/g, "");

				//set regular express
				setRegExp();
				//null
				if (IOValue == "") {
					alert("The value you input can't be null");
					return false;
				}
				if (!reg.test(IOValue)) {
					alert("The value you input is not correct. Please input again");
					return false;
				}
				let numList = [3, 4, 5, 210];
				let index = numList.indexOf(regSelection);
				if (index > -1) {

					let inputValue = parseFloat(IOValue);
					if (min !== "") {
						let minValue = parseFloat(min);
						if (inputValue < minValue) {
							alert("The value you entered cannot be less than " + minValue + ". Please input again");
							return false;
						}
					}
					if (max !== "") {
						let maxValue = parseFloat(max);
						if (inputValue > maxValue) {
							alert("The value you entered cannot be greater than " + maxValue + ". Please input again");
							return false;
						}
					}
				}





			}

			// setup up screen for initial display

			$('#mainPage').bind('pageshow', function () {
				/*
									$(document).on("swipeleft", "#mainPage", function(e)
									{
										if ($.mobile.activePage.jqmData("panel") !== "open")
										{
											if (e.type === "swipeleft")
											{
												$("#testPanel").panel("open");
											}
										}
									});
									*/


				title = OTX.hmi.getArgument('title');
				conditions_heading = OTX.hmi.getArgument('conditions_heading');
				conditions = OTX.hmi.getArgument('conditions');
				steps_heading = OTX.hmi.getArgument('steps_heading');
				steps = OTX.hmi.getArgument('steps');
				regSelection = OTX.hmi.getArgument('regSel');
				min = OTX.hmi.getArgument('min');
				max = OTX.hmi.getArgument('max');
				isNumber = OTX.hmi.getArgument('isNumber');
				strLen = OTX.hmi.getArgument('strLen');
				InputValue = OTX.hmi.getArgument('InputValue');
				GSPlib.page.fixJxBrowserChangePageInputFocus();


				$('#title').text(title);
				$('#conditions_heading').text(conditions_heading);
				$('#steps_heading').text(steps_heading);
				//document.getElementById("IOText").value=InputValue;
				$("#IOText:text").val(InputValue);
				//document.getElementById("IOText").focus();

				var stepsString = "";

				for (var step = 0; step < steps.length; step++) {
					stepsString = stepsString + "<li>" + steps[step] + "</li>";
				}

				$('#steps').html(stepsString);

				var conditionsString = ""
				for (var step = 0; step < conditions.length; step++) {
					conditionsString = conditionsString + "<li>" + conditions[step] + "</li>";
				}
				$('#conditions').html(conditionsString);

				if (!isNumber) {

					$("#inputNotice").text(message);

					var cvalue = $("#IOText").val();

					//replace the space
					cvalue = cvalue.replace(/[ ]/g, "");

					if (cvalue.length == 0) {
						$("#inputCharNumber").text("");
					}
					else {

						$("#inputCharNumber").text(cvalue.length);

					}

				}

			});


			$("#response_yes").click(function (e) {

				//check validation
				if (isValidation() == false) {
					return;
				}

				var curValue = "";

				curValue = $("#IOText").val();

				curValue = curValue.replace(/[ ]/g, "");

				if (regSelection == 0)//VIN
				{
					curValue = curValue.toUpperCase();
				}

				OTX.hmi.valueChangedInPage('InputValue', curValue);

				OTX.hmi.valueChangedInPage('result', '1');

				OTX.hmi.closeScreen();

			});

			$("#response_no").click(function (e) {
				OTX.hmi.valueChangedInPage('result', '2')
				OTX.hmi.closeScreen();
			});

			//$("#IOText").on('blur', function()
			function doKeyup(obj) {
				//display the input char number
				if (!isNumber) {

					var cvalue = obj.value.replace(/[ ]/g, "");
					$("#inputCharNumber").text(cvalue.length);
				}
			}
		</script>
	</div>
</body>

</html>
