<!--
 This page is a test page to show how to deal with a single quantity value as an InParameter to a screen.
 -->

<!DOCTYPE html>
<html>
<head>
<title>Dynamic screen test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="jquery-1.9.1.min.js"></script>
<script src="jquery.mobile-1.3.0.min.js"></script>
<script src="js-url.min.js"></script>
<script src="otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<META http-equiv="Pragma" content="no-cache">
<META http-equiv="Expires" content="-1">
</head>

<body>
	<div data-role="page" id="mainPage">

		<div data-role="header">
			<h1><span id="title"></span></h1>
		</div>

		<div data-role="content">
			<div id="message"></div>
			<div id="barCharts" style="width:800px; height:300px;margin: 0px auto;"></div>
			<div id="question"></div>
		</div>

		<div data-role="footer" class="ui-bar" data-theme="c" data-position="fixed">
			<div class="ui-grid-a">
				<div class="ui-block-a">
					<div style="padding-right:20px;">
						<button id="yes" type="button" data-theme="b" data-mini="false" data-icon="check" data-iconpos="top">Yes</button>
					</div>
				</div>
				<div class="ui-block-b">
					<div style="padding-right:20px;">
						<button id="no" type="button" data-theme="b" data-mini="false" data-icon="delete" data-iconpos="top">No</button>
					</div>
				</div>
			</div>
		</div>
		<script>

	function tickMark(context, value, x, y)
	{
		context.lineWidth = 2;
		context.lineStyle = "#606060";
		context.beginPath();
		context.moveTo(x, y);
		context.lineTo(x, y + 10);
		context.stroke();
		context.fillStyle = "#404040";
		context.font = "12pt arial";
		context.textAlign = "center";
		context.fillText(value, x, y + 24);
	}


	function BarGraph(ctx)
	{

	  // Private properties and methods

	  var that = this;

	  // Draw method updates the canvas with the current display
		var draw = function (arr) {

		  var numOfBars = arr.length;
		  var barWidth;
		  var barHeight;
		  var labelHeight = 60;
		  var ratio;
		  var maxBarWidth;
		  var largestValue;
		  var graphAreaX = 0;
		  var graphAreaY = 0;
		  var graphAreaWidth = that.width;
		  var graphAreaHeight = that.height;
		  var i;

			// Update the dimensions of the canvas only if they have changed
		  if (ctx.canvas.width !== that.width || ctx.canvas.height !== that.height) {
			ctx.canvas.width = that.width;
			ctx.canvas.height = that.height;
		  }

		  // allow margins

		  graphAreaWidth= graphAreaWidth - that.margin * 2;
		  graphAreaHeight = graphAreaHeight - that.margin * 2;

		  // Calculate dimensions of the bar
		  barHeight = graphAreaHeight/numOfBars - labelHeight;
		  maxBarWidth = graphAreaWidth;

		  // Determine the largest value in the bar array
		  var largestValue = 0;
		  for (i = 0; i < arr.length; i += 1) {
			if (arr[i] > largestValue) {
			  largestValue = arr[i];
			}
		  }

		  ctx.restore();
		  ctx.save();
		  ctx.translate(that.margin, that.margin);

		// for each bar
		for (i = 0; i < arr.length; i += 1)
		{
			// Set the ratio of current bar compared to the maximum
			if (that.maxValue)
				{ ratio = arr[i] / that.maxValue; }
			else
				{ ratio = arr[i] / largestValue; }

			barWidth = ratio * maxBarWidth;

			// draw bar background
			ctx.fillStyle = "#808080";
			ctx.lineWidth = 0;
			ctx.fillRect(0, 0, maxBarWidth, barHeight);

			// draw bar color
			if ( barWidth > maxBarWidth ) { barWidth = maxBarWidth; }
			if ( barWidth < 0 )	{ barWidth = 0; }

			if (arr[i] > that.limitMaxArray[i])
			{
				ctx.fillStyle = "#ff0000";
			}
			else
			{
				ctx.fillStyle = that.colors[i];
			}


			ctx.fillRect(0, 0, barWidth, barHeight);

			// write bar value
			ctx.fillStyle = "#FFFFFF";
			ctx.font = "24pt arial";
			ctx.textAlign = "center";
			ctx.fillText(parseInt(arr[i],10), maxBarWidth/2, labelHeight/2 + barHeight/2);

			// write tickMarks
			tickMark(ctx, that.rangeMinArray[i], maxBarWidth * that.rangeMinArray[i]/(that.rangeMaxArray[i] - that.rangeMinArray[i]), barHeight);
			tickMark(ctx, that.rangeMaxArray[i], maxBarWidth * that.rangeMaxArray[i]/(that.rangeMaxArray[i] - that.rangeMinArray[i]), barHeight);
			tickMark(ctx, that.limitMinArray[i], maxBarWidth * that.limitMinArray[i]/(that.rangeMaxArray[i] - that.rangeMinArray[i]), barHeight);
			tickMark(ctx, that.limitMaxArray[i], maxBarWidth * that.limitMaxArray[i]/(that.rangeMaxArray[i] - that.rangeMinArray[i]), barHeight);

			// draw bar label if it exists
			if (that.labelArr[i])
			{
				ctx.fillStyle = "#404040";
				ctx.font = "18pt arial";
				ctx.textAlign = "center";
				ctx.fillText(that.labelArr[i], maxBarWidth/2, barHeight + labelHeight/2);
			}

			ctx.translate(0, that.height/numOfBars);

		} // for

	}  ;

	  // Public properties and methods

	  this.width  = 800;
	  this.height = 300;
	  this.maxValue;
	  this.margin = 20;
	  this.colors = ["purple", "red", "green", "yellow"];
	  this.curArr = [];
	  this.backgroundColor = "#fff";
	  this.labelArr = [];
	  this.rangeMinArray = [];
	  this.rangeMaxArray = [];
	  this.limitMinArray = [];
	  this.limitMaxArray = [];

  // Update method sets the end bar array and starts the animation
	this.update = function (newArr) {

	  // If length of target and current array is different
	  if (that.curArr.length !== newArr.length) {
		that.curArr = newArr;
	  }

	  draw(newArr);

	};
}

			function createCanvas(divName)
			{
				var div = document.getElementById(divName);
				var canvas = document.createElement('canvas');
				div.appendChild(canvas);
				var ctx = canvas.getContext("2d");
				return ctx;
			}

			$('#mainPage').bind('pagebeforeshow', function (e, data) {

				var location = $(this).data('url');
				$('#title').text(OTX.hmi.getArgument('title', location));
				$('#message').text(OTX.hmi.getArgument('message', location));
				$('#question').text(OTX.hmi.getArgument('question', location));

				var ctx = createCanvas("barCharts");
				ctx.save();
				var graph = new BarGraph(ctx);
				graph.maxValue = OTX.hmi.getArgument('rangeMax', location);
				graph.margin = 20;
				graph.colors = ["#00ff00"];
				graph.rangeMinArray = [OTX.hmi.getArgument('rangeMin', location)];
				graph.rangeMaxArray = [OTX.hmi.getArgument('rangeMax', location)];
				graph.limitMinArray = [OTX.hmi.getArgument('limitMin', location)];
				graph.limitMaxArray = [OTX.hmi.getArgument('limitMax', location)];
				graph.labelArr = [OTX.hmi.getArgument('valueName', location)];
				graph.update([0]);

				OTX.hmi.addValueListener('value', function(newValue) {
					graph.update([newValue]);
			    });

			});

			$('#yes').click(function() {
				OTX.hmi.valueChangedInPage('result', 'yes')
				OTX.hmi.closeScreen();
			});

			$('#no').click(function() {
				OTX.hmi.valueChangedInPage('result', 'no')
				OTX.hmi.closeScreen();
			});

			$('#mainPage').bind('pageremove', function() {
				OTX.hmi.clearValueListeners();
			});

		</script>
	</div>
</body>
</html>
