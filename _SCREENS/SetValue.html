<!-- 
 This page is displayed whenever a show document dialog is used in OTX.  It will display 
 the referenced page in an iframe. 
 -->

<!DOCTYPE html>
<html>
<head>
<title>Dynamic screen test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="jquery-1.9.1.min.js"></script>
<script src="jquery.mobile-1.3.0.min.js"></script>
<script src="js-url.min.js"></script>
<script src="otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<META http-equiv="Pragma" content="no-cache">
<META http-equiv="Expires" content="-1">

</head>

<body>
	<div data-role="page" id="mainPage">

		<header data-role="header">
			<h1 id="title">Set a value test</h1>
		</header>

		<div data-role="content">
			<label id="valueLabel" for="value"></label> <input type="range"
				name="value" id="value" data-highlight="true" />
		</div>



		<div data-role="footer" data-position="fixed">
			<input type="button" id="setButton" data-role="button" value="Set" />
		</div>

		<script type="text/javascript">
			var UPPER_LIMIT = 'upperLimit';
			var LOWER_LIMIT = 'lowerLimit';
			var VALUE = 'value';
			var VALUE_NAME = 'valueName';

			$('#mainPage').bind('pagebeforeshow', function(e, data) {
				$('#valueLabel').text(OTX.hmi.getArgument(VALUE_NAME));
				var slider = $('#value');
				slider.val(OTX.hmi.getArgument(VALUE));
				slider.attr('min', OTX.hmi.getArgument(LOWER_LIMIT));
				slider.attr('max', OTX.hmi.getArgument(UPPER_LIMIT));
				slider.slider('refresh');

				slider.change(function() {
					OTX.hmi.valueChangedInPage('value', $(this).val());
				});
			});

			$('#setButton').click(function() {
				OTX.hmi.closeScreen();
			});
		</script>

	</div>



</body>
</html>
