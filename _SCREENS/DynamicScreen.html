<!-- 
 This page is displayed whenever a show document dialog is used in OTX.  It will display 
 the referenced page in an iframe. 
 -->

<!DOCTYPE html>
<html>
<head>
<title>Dynamic screen test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="jquery-1.9.1.min.js"></script>
<script src="jquery.mobile-1.3.0.min.js"></script>
<script src="js-url.min.js"></script>
<script src="otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<META http-equiv="Pragma" content="no-cache">
<META http-equiv="Expires" content="-1">
</head>

<body>
	<div data-role="page" id="mainPage">
		
		<header data-role="header">
			<h1 id="title">Dynamic content test</h1>
		</header>
	
		<div data-role="listview">
			<ul>
			<li>q1 <span id="q1"></span></li>
		</ul>
		<input type="range" name="slider-fill" id="i1" value="0" min="0" max="100" data-highlight="true" />
		</div>

		<script type="text/javascript">
			OTX.hmi.addValueListener('q1', function(quantity) {
				$('#q1').text(quantity.value + '(' + quantity.unit + ')');
			});

			OTX.hmi.addValueListener('i1', function(newValue) {
				$('#i1').val(newValue);
				$('#i1').slider('refresh');
			});

			$('#mainPage').bind('pageremove', function() {
				OTX.hmi.clearValueListeners();
			});
		</script>

	</div>


</body>
</html>
