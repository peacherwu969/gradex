<!DOCTYPE html>
<html>
<head>
<title>Input Output Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>

<body>
	<div data-role="page" id="mainPage" unselectable="on" onselectstart="return false;" style="-moz-user-select:none; -webkit-user-select:none; -ms-user-select:none; user-select:none;">

		<div data-role="header">
			<h1 id="title"></h1>
		</div>

		<div data-role="content">
			<h3 id="conditions_heading"></h3>
			<ul id="conditions"></ul>
			<h3 id="steps_heading"></h3>
			<ul id="steps"></ul>
		</div>

	    <div data-role="footer" data-theme="c" data-position="fixed">
	    	<div>
					<fieldset class="ui-grid-a">
						<div class="ui-block-a"><button id="response_yes" data-corners="true" data-mini="false" data-icon="check" data-iconpos="left" value = "<@gx_translate text_id='GX.COMMON.YES' />"></button></div>
						<!--<div class="ui-block-b"><button id="response_no" data-corners="true" data-mini="false" data-icon="delete" data-iconpos="left"><@gx_translate text_id="GX.COMMON.NO" /></button></div>-->
						<!--<div class="ui-block-c"><button id="response_return" data-corners="true" data-mini="false" data-icon="refresh" data-iconpos="left">Return Control To ECU</button></div>-->
						<div class="ui-block-b"><button id="response_cancel" data-corners="true" data-mini="false" data-icon="back" data-iconpos="left"><@gx_translate text_id="GX.COMMON.CANCEL" /></button></div>
					</fieldset>
				</div>
      </div> <!-- footer -->

		<script type="text/javascript">
		
			// setup up screen for initial display

			$('#mainPage').bind('pageshow', function()
				{

					$(document).on("swipeleft", "#mainPage", function(e)
					{
						if ($.mobile.activePage.jqmData("panel") !== "open")
						{
							if (e.type === "swipeleft")
							{
								$("#testPanel").panel("open");
							}
						}
					});



					title = OTX.hmi.getArgument('title');
					conditions_heading = OTX.hmi.getArgument('conditions_heading');
					conditions = OTX.hmi.getArgument('conditions');
					steps_heading = OTX.hmi.getArgument('steps_heading');
					steps = OTX.hmi.getArgument('steps');
					button_text = OTX.hmi.getArgument('button_text');
					buttonList = button_text.split(';');
					GSPlib.page.fixJxBrowserChangePageInputFocus();
					
					$('#title').text(title);
					$('#conditions_heading').text(conditions_heading);
					$('#steps_heading').text(steps_heading);
					
					$('#response_yes').text(buttonList[0]);
					$('#response_yes').button("refresh");
					$('#response_no').text(buttonList[1]);
					$('#response_no').button("refresh");
					//$('#response_return').text(buttonList[2]);
					//$('#response_return').button("refresh");
					$('#response_cancel').text(buttonList[3]);
					$('#response_cancel').button("refresh");
					
					
					var stepsString = "";

					for (var step=0; step < steps.length; step++)
					{
					     stepsString = stepsString + "<li>" + steps[step] + "</li>";
					}

					$('#steps').html(stepsString);
					
					var conditionsString = "";
					for (var step=0; step < conditions.length; step++)
					{
					     conditionsString = conditionsString + "<li>" + conditions[step] + "</li>";
					}
					$('#conditions').html(conditionsString);
					
				});

				$("#response_yes").click(function(e)
				{
					OTX.hmi.valueChangedInPage('result', '1')
					OTX.hmi.closeScreen();
				});

				$("#response_no").click(function(e)
				{
					OTX.hmi.valueChangedInPage('result', '2')
					OTX.hmi.closeScreen();
				});
				
				//$("#response_return").click(function(e)
				//{
					//OTX.hmi.valueChangedInPage('result', '3')
					//OTX.hmi.closeScreen();
				//});
				
				$("#response_cancel").click(function(e)
				{
					OTX.hmi.valueChangedInPage('result', '4')
					OTX.hmi.closeScreen();
				});

		</script>
	</div>
</body>
</html>
