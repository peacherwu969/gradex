<!DOCTYPE html>
<html>
<head>
<title>Foton Choice</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>

<body>
	<div data-role="page" id="mainPage" unselectable="on" onselectstart="return false;" style="-moz-user-select:none; -webkit-user-select:none; -ms-user-select:none; user-select:none;">
		<div data-role="header" >
			<h1 id="title"></h1>
		</div>
		<div data-role="content">
			<div data-role = "fieldcontain" id = "choiceList">
			</div>
		</div>
		<div data-role="footer" data-theme="c" data-position="fixed">
	    <div>
				<fieldset class="ui-grid-b">
					<div class="ui-block-a"></div>
					<div class="ui-block-b"><button id="response_yes" data-corners="true" data-mini="false" data-icon="check" data-iconpos="left">Yes</button></div>
					<!--<div class="ui-block-c"><button id="response_no" data-corners="true" data-mini="false" data-icon="delete" data-iconpos="left">No</button></div>-->
				</fieldset>
			</div>
    </div> <!-- footer -->

		<script type="text/javascript">
							
			var choiceIndex;
			
			$('#mainPage').bind('pagebeforecreate', function()
				{

					$(document).on("swipeleft", "#mainPage", function(e)
					{
						if ($.mobile.activePage.jqmData("panel") !== "open")
						{
							if (e.type === "swipeleft")
							{
								$("#testPanel").panel("open");
							}
						}
					});

					title = OTX.hmi.getArgument('title');
					legend = OTX.hmi.getArgument('legend');
					choiceList = OTX.hmi.getArgument('choiceList');
					
					$('#title').text(title); 
 
 					var htmlTxt = "";
 					htmlTxt = htmlTxt + "<fieldset data-role = \"controlgroup\">";
 					htmlTxt = htmlTxt + "<legend>" + legend + "</legend>";
 										
					for (var step=0; step < choiceList.length; step++)
					{					   
						if (step <= 0)
						{
							htmlTxt = htmlTxt + "<input type = \"radio\" name = \"radio-choice\" id = \"radio-choice-" + step + "\" value = \"" + step + "\" checked = \"checked\"/>";
						}
						else
						{
							htmlTxt = htmlTxt + "<input type = \"radio\" name = \"radio-choice\" id = \"radio-choice-" + step + "\" value = \"" + step + "\" />";
						}
						
						
						htmlTxt = htmlTxt + "<label for = \"radio-choice-" + step + "\">";
						htmlTxt = htmlTxt + choiceList[step] + "</label>";					     
					}
					
					htmlTxt = htmlTxt + "</fieldset>";
					
					$('#choiceList').html(htmlTxt);
					
				});					

				$("#response_yes").click(function(e)
				{
					OTX.hmi.valueChangedInPage('result', '1');				
					
					var choice = 	$('input[name="radio-choice"]:checked').val();
					
					OTX.hmi.valueChangedInPage('choiceIndex', choice);
				
					OTX.hmi.closeScreen();
				});

				$("#response_no").click(function(e)
				{
					OTX.hmi.valueChangedInPage('result', '2');
					OTX.hmi.closeScreen();
				});			
		
		</script>
	</div>
</body>
</html>
