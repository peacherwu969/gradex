<!DOCTYPE html>
<html>
<head>
<title>HMS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<link rel="stylesheet" href="common/nv.d3.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script type="text/javascript" src="common/d3.min.js"></script>
<script type="text/javascript" src="common/nv.d3.min.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>

<body>
	<div data-role="page" id="mainPage" unselectable="on" onselectstart="return false;" 
			style="-moz-user-select:none; -webkit-user-select:none; -ms-user-select:none; user-select:none; ">
		
		<div data-role="content">		
		  <style type="text/css" scoped> 
				table
				{ 
					border-collapse: collapse; 
					margin: 0 auto; 
					text-align: center; 
					min-width: 400px;
				} 
				table td, table th 
				{ 
					border: 1px solid #000; 
					<!--background: #fff; -->
					height: 10px;
				}  
				table thead tr td
				{  
					border: 1px solid #000; 
					font-size: 18px;
					height: 10px;
				}
				table tbody tr 
				{ 
					<!--background: #FFF;-->
					height: 10px;
				}
				table tr:nth-child(odd) 
				{ 
					background: #fff; 
					font-size: 18px;
				} 
				table tr:nth-child(even) 
				{ 
					background: #fff;
					font-size: 18px;
				}		 
				img {
					cursor: pointer
				}
			</style>
			<h3 align="center" id="funtitle"></h3>			
			<table width="100%" height="150px" id="table-column-toggle" style="min-width:200px;overflow:hidden;">		
				<tbody id="H2tableData"> 
				</tbody>		
			</table>				
			<br>
			<div style="height:350px;">
				<table width="100%" height="350px" id="datastream">		
					<thead>				
						<tr height="30px" style="background-color: #D8D8D8;font-weight:bold;">
							<td width="70%"><@gx_translate text_id="GX.COMMON.NAME" /></td>
							<td width="30%"><@gx_translate text_id="GX.COMMON.VALUE" /></td>
						</tr>  	
					</thead>
					<tbody id="DatastreamtableData"> 
					</tbody>	
				</table>		 
			</div>
		</div>	
		
		<div data-role="footer" data-position="fixed">
			<div data-role="controlgroup" data-type="horizontal" style="text-align:center">		
				<button id="closeBtn" data-transition="slide" data-corners="true" data-mini="false" data-icon="delete" data-inline="false">
				<@gx_translate text_id="GX.COMMON.CLOSE" />
				</button>						
			</div>		
		</div>
		
		<script type="text/javascript">
					
			var	titleStr = OTX.hmi.getArgument('titleParam');
		 	var	nameList = OTX.hmi.getArgument('nameListParam');
			var	dsNameList = OTX.hmi.getArgument('dsNameListParam');
			var trContent = '', dsTrContent = '';
 
			//var valueList = OTX.hmi.getArgument('valueList');		
			//alert('titleStr:' + titleStr);
			$('#mainPage').bind('pageshow', function() {
	
				//alert('nameList:' + nameList);				
				$('#funtitle').html(titleStr);
				nameList.forEach(function (item, index) {
				 
					trContent += '<tr height="30px"><td width="70%">'+item+'</td><td width="200px" style="min-width:165px;white-space:nowrap"><button style="height:40px;width:80px;cursor: pointer;" id="open-'+(index+1)+'"><@gx_translate text_id="SAIC_LDV_EV79_PTG.DS_TEXTTABLE.OPEN" /></button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button style="height:40px;width:80px;cursor: pointer;" id="close-'+(index+1)+'"><@gx_translate text_id="SAIC_LDV_EV79_VMS.DS_TEXTTABLE.CLOSE" /></button></td></tr>';								
				});
				//alert('trContent: ' + trContent);
				$('#H2tableData').html(trContent);		
				
				dsNameList.forEach(function (item, index) {
				 
					dsTrContent += '<tr><td>'+item+'</td><td><span id="datastreamvalue'+(index+1)+'"></span></td></tr>';								
				});			
				//alert('dsTrContent: ' + dsTrContent);
				$('#DatastreamtableData').html(dsTrContent);				

				$("button[id^='open-']").click(function(e){
					var id = $(this).attr('id');
					OTX.hmi.valueChangedInPage('btnValueParam', id);	
				});
				
				$("button[id^='close-']").click(function(e){
					var id = $(this).attr('id');
					OTX.hmi.valueChangedInPage('btnValueParam', id); 
				});				
			});								
			 			
			$("#closeBtn").click(function(e) {
			 
				OTX.hmi.valueChangedInPage('btnValueParam', 'exit');	
				OTX.hmi.closeScreen();		 	 
			});				
						
			OTX.hmi.addValueListener('valueParam1', function(newValue) {
				 
				$("#datastreamvalue1").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam2', function(newValue) {
				 
				$("#datastreamvalue2").html(newValue);
			});			
			OTX.hmi.addValueListener('valueParam3', function(newValue) {
				 
				$("#datastreamvalue3").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam4', function(newValue) {
				 
				$("#datastreamvalue4").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam5', function(newValue) {
				 
				$("#datastreamvalue5").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam6', function(newValue) {
				 
				$("#datastreamvalue6").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam7', function(newValue) {
				 
				$("#datastreamvalue7").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam8', function(newValue) {
				 
				$("#datastreamvalue8").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam9', function(newValue) {
				 
				$("#datastreamvalue9").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam10', function(newValue) {
				 
				$("#datastreamvalue10").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam11', function(newValue) {
				 
				$("#datastreamvalue11").html(newValue);
			});
			OTX.hmi.addValueListener('valueParam12', function(newValue) {
				 
				$("#datastreamvalue12").html(newValue);
			});

		</script>
	</div>
</body>
</html>
