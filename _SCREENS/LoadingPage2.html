<!DOCTYPE html>
<html>
<head>
<title>LoadingData</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>


<style type="text/css">
html {
 min-height: 100%;
 _height:100%;
 }
body {
 margin: 0;
 padding: 0;
 min-height: 100%;
 _height:100%;
 }
 
</style>
<body >
	<div data-role="page" id="mainPage">
		<div data-role="header" >
			<h1 id="title"></h1>
		</div>
		<input type="hidden" name="message1" id="message1" value="<@gx_translate text_id='SAIC_LDV_EV79_UI.MESSAGE.SELECTONEECU' />" />
		<div id ="TableDiv" data-role="content" style="padding:6px;margin:3px;">
			<table id="CarTable" style="width:100%;height:100%">
				<tr>
					<th style="width:25%;text-align:center">
						<table id="CarTableBCn" style="border-left:3px solid #458B74">
							<tr style="color: #f60;background: #666;"><td>B-Can</td></tr>
							<tr>
								<td >
									<input name="ECU" type="checkbox" id="ABS" value="ABS" style="width:20px;height:10px;"/>
									<Label id="ecuLabel" for="ABS" style="background:#FF0000;color: #000;margin:0px;">ABS&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img src="/images/warn.png"></img>34</Label>
								</td>
							</tr>
							<tr>
								<td>
									<input name="ECU" type="checkbox" id="HCM" value="HCM" />
									<Label id="ecuLabel" for="HCM" style="background:#BEBEBE;color: #000;margin:0px;">HCM</Label>
								</td>
							</tr>
							<tr>
								<td>
									<input name="ECU" type="checkbox" id="TBOX" value="TBOX" />
									<Label id="ecuLabel" for="TBOX" style="background:#32CD32;color: #000;margin:0px;">TBOX</Label>
								</td>
							</tr>
						</table>
					</th>
					<th style="width:75%" colspan="3" rowspan="3">
						<table id="CarTableButton" style="width:100%;height:100%;" >
							<tr >
								<th style="width:33%;height:33%;"></th>
								<th style="width:33%;height:33%;"></th>
								<th style="width:33%;height:33%;text-align:left">
									<img src="/images/green.png">ECU&nbsp;Connected<br/>
									<img src="/images/red.png">ECU&nbsp;Connected with DTC<br/>
									<img src="/images/gray.png">ECU&nbsp;Disconnected
								</th>
							</tr>
							<tr>
								<td style="width:33%;height:33%;">&nbsp;</td>
								<td style="width:33%;height:33%;">&nbsp;</td>
								<td style="width:33%;height:33%;">&nbsp;</td>
							</tr>
							<tr>
								<td style="width:33%;height:33%;">&nbsp;</td>
								<td style="width:33%;height:33%;">&nbsp;</td>
								<td>
									<div>
										<button id="ok" data-transition="slide" data-corners="true" data-mini="false" data-icon="check" data-inline="false"><@gx_translate text_id="GX.COMMON.OK" /></button><br/>
										<button id="cancel" data-transition="slide" data-corners="true" data-mini="false" data-icon="back" data-inline="false"><@gx_translate text_id="GX.COMMON.CANCEL" /></button>
									</div>
								</td>
							</tr>
						</table>
					</th>
				</tr>
				<tr>
					<td>
						<table id="CarTableCCn" style="border-left:3px solid #458B74">
							<tr style="color: #f60;background: #666;text-align:center""><td>C-Can</td></tr>
							<tr>
								<td>
									<input name="ECU" type="checkbox" id="IPK" value="IPK" />
									<Label id="ecuLabel" for="IPK" style="background:#32CD32;color: #000;margin:0px;">IPK</Label>
								</td>
							</tr>
							<tr>
								<td>
									<input name="ECU" type="checkbox" id="BCM" value="BCM" />
									<Label id="ecuLabel" for="BCM" style="background:#FF0000;color: #000;margin:0px;">BCM&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img src="/images/warn.png"></img>66</Label>
								</td>
							</tr>
							<tr>
								<td>
									<input name="ECU" type="checkbox" id="FICM" value="FICM" />
									<Label id="ecuLabel" for="FICM" style="background:#BEBEBE;color: #000;margin:0px;">FICM</Label>
								</td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td>
						<table id="CarTablePCn" style="border-left:3px solid #458B74">
							<tr style="color: #f60;background: #666;text-align:center""><td>P-Can</td></tr>
							<tr>
								<td>
									<input name="ECU" type="checkbox" id="MC" value="MC" />
									<Label id="ecuLabel" for="MC" style="background:#32CD32;color: #000;margin:0px;">MC</Label>
								</td>
							</tr>
							<tr>
								<td>
									<input name="ECU" type="checkbox" id="TPMS" value="TPMS" />
									<Label id="ecuLabel" for="TPMS" style="background:#BEBEBE;color: #000;margin:0px;">TPMS</Label>
								</td>
							</tr>
							<tr>
								<td>
									<input name="ECU" type="checkbox" id="LCA" value="LCA" />
									<Label id="ecuLabel" for="LCA" style="background:#FF0000;color: #000;margin:0px;">LCA&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img src="/images/warn.png"></img>14</Label>
								</td>
							</tr>
						</table>
					</td>


				</tr>
			</table>
		</div>
		<script>
		var color="";
		var ecuNames="";
		var message=document.getElementById("message1").value;
		
		$(document).ready(function()
		{
			$("Label").mouseover(function(){
				color=$(this).css("background-color");
				$(this).css("background-color","#ADD8E6");
			});
			$("Label").mouseout(function(){
				$(this).css("background-color",color);
			});
		});
		
		
		
		$('#mainPage').bind('pagebeforecreate', function(e, data)
		{
			//label = OTX.hmi.getArgument('label');
			//scaleMin = OTX.hmi.getArgument('scaleMin').value;
			//scaleMax = OTX.hmi.getArgument('scaleMax').value;
			//scaleOrigin = OTX.hmi.getArgument('scaleOrigin').value;
			//ticks = OTX.hmi.getArgument('ticks');
			//createBarCharts(label, scaleMin, scaleMax, scaleOrigin, ticks);
			//$(#CarTable).css("background-image","url(/images/SAIC/0028573004.png)");
			//$(#CarTable).css("center","center");
			//$(#CarTable).css("background-size","cover");
			$("#title").html("ECU identification.");
			
			$("#TableDiv").width($(document).width()-38).height($(document).height()-88);
			$("#CarTableBCn").width($("#TableDiv").width()/4).height($("#TableDiv").height()/4);
			$("#CarTableCCn").width($("#TableDiv").width()/4).height($("#TableDiv").height()/4);
			$("#CarTablePCn").width($("#TableDiv").width()/4).height($("#TableDiv").height()/4);
			
			$("#CarTableButton").css({"background":"url(/images/SAIC/0028573004.png) no-repeat"});
			//$("#CarTableButton").width($("#TableDiv").width()/4).height($("#TableDiv").height()/4);
			
		}); 
		
		//$("#ecuLabel").moveover(function () {
			//color= $(this).css("background");
			//alert(1);
			//$(this).css("background":"#ADD8E6");
		//});
		
		//$("#ecuLabel").bind("moveout", function () {
		//	$(this).css("background":color);
		//});
		
		$("#ok").bind("click", function () {

               $('input[name="ECU"]:checked').each(function(){ 
				ecuNames=ecuNames+","+$(this).val();
				
				}); 
		
			if(0!=ecuNames.length) 
			{
				ecuNames=ecuNames.substr(1);
			}
			else
			{
				alert(message);
				return;
			}

			OTX.hmi.valueChangedInPage('ecuNames', ecuNames);
			OTX.hmi.valueChangedInPage('result', "1");
			OTX.hmi.closeScreen();

            });
		$("#cancel").bind("click", function () {
            OTX.hmi.valueChangedInPage('result', "2");
			OTX.hmi.closeScreen();   
        });
		
		
		</script>	
	<div/>
</body>
</html>
