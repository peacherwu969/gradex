<!DOCTYPE html>
<html>
<head>
<title>Diagnostic Instruction Steps</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>

<body>
	<div data-role="page" id="mainPage" unselectable="on" onselectstart="return false;" style="-moz-user-select:none; -webkit-user-select:none; -ms-user-select:none; user-select:none;">

			<div data-role="header">
			<h1 id="title"></h1>
		</div>

		<div data-role="content">
			<h3 id="subtitle"></h3>
			<p id="message"></p>

			
			<table width = "100%" id="table-column-toggle" class="ui-responsive table-stroke" style="table-layout:fixed;" >
				<thead>
					<tr>
						<td width="10%"></td>
						<td width="40%"><h4><@gx_translate text_id="SAIC_LDV_EV79_UI.MESSAGE.TITLE" /></h4></td>
						<td width="40%"><h4><@gx_translate text_id="GX.COMMON.VALUE" /></h4></td>
						<td width="10%"></td>
					</tr>
				</thead>
				<tbody style="word-wrap:break-word;" id="tableData">
				</tbody>
			</table>			
					
		</div>
		
	    <div data-role="footer" data-theme="c" data-position="fixed">
	    	<div>
				<fieldset class="ui-grid-b">
					<div class="ui-block-a"></div>
					<div class="ui-block-b"><button id="ok" data-corners="true" data-mini="false" data-icon="check" data-iconpos="left"><@gx_translate text_id="GX.COMMON.OK" /></button></div>

				</fieldset>
			</div>
        </div> <!-- footer -->

		<script type="text/javascript">

			// setup up screen for initial display

			$('#mainPage').bind('pageshow', function()
				{

					title = OTX.hmi.getArgument('title');
					subtitle = OTX.hmi.getArgument('subtitle');
					message = OTX.hmi.getArgument('message');
					nameList = OTX.hmi.getArgument('nameList');
					valueList = OTX.hmi.getArgument('valueList');
					optionList = OTX.hmi.getArgument('optionList');

					$('#title').text(title);
					$('#informationTitle').text(title);
					$('#subtitle').text(subtitle);
					$('#message').text(message);					
/*
					var stepsString = "";

					for (var step=0; step < steps.length; step++)
					{
					     stepsString = stepsString + "<li>" + steps[step] + "</li>";
					}

					$('#steps').html(stepsString);
				});
*/
					var listTxt = "";
					var tempList = [];
					
					for (var step=0; step < nameList.length; step++)
					{	
						
						if(!isNaN(parseFloat(valueList[step])))
						{
							//alert('1');
							if(valueList[step].toString().indexOf(".")==-1)
							{
								//alert('2');
								tempList[step] = valueList[step];
							}
							else
							{
								//alert('3');
								tempList[step] = parseFloat(valueList[step]).toFixed(3);
							}
						
						}
						else
						{
							//alert('4');
							tempList[step] = valueList[step];
						}

						
						 //stepsString = stepsString + "<li>" + steps[step] + "</li>";
					     listTxt = listTxt +"<tr>";
					     listTxt = listTxt + "<td><td>" + nameList[step] +"</td><td>"+ tempList[step]
					     +"</td><td>"
					     +"</td>";
					     listTxt = listTxt + "</tr>";
					     					     
					}
					
					$('#tableData').html(listTxt);

				});
				


				$("#ok").click(function(e)
				{
					OTX.hmi.closeScreen();
				});

		</script>
	</div>
</body>
</html>
