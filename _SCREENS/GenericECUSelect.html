		<script type="text/javascript">
			$('#mainPage').bind('pagebeforecreate', function()
			{
				ecus = OTX.hmi.getArgument('ecus');
				var ecuName;

				$("button").each(function()
				{
					buttonId = $(this).attr('id');
					buttonList = buttonId.split('_');
					if((buttonId!="response_back")&&(buttonId!="Tester")&&(buttonId!="CGW"))
					{
						for(var ecu=0; ecu < ecus.length; ecu++)
						{
							if(buttonList.length<=1)//only one ecu in button
							{
								if(buttonId==ecus[ecu])
								{
									$(this).attr('disabled',false);
								}
							}
							else//two or more ecu in button
							{
								for(var i=0;i<buttonList.length;i++)
								{
									if(buttonList[i]==ecus[ecu])
									{
										$(this).attr('disabled',false);
									}
								}
							}
						}
					}
				});
			
				$("button").click(function()
				{
					buttonId = $(this).attr('id');
					if((buttonId=="response_back")||(buttonId=="Tester")||(buttonId=="CGW"))
					{
						return;
					}
					buttonList = buttonId.split('_');
					if(buttonList.length<=1)//only one ECU name
					{
						OTX.hmi.valueChangedInPage('ecu', buttonId);
					}
					else//two or more ECU name
					{
						var ECUname="";
						for(var ecu=0; ecu < ecus.length; ecu++)
						{
							for(var i=0;i<buttonList.length;i++)
								{
									if(buttonList[i]==ecus[ecu])
									{
										if(ECUname=="")
										{
											ECUname=buttonList[i];
										}
										else
										{
											ECUname=ECUname + ";" + buttonList[i];
										}
									}
								}
						}
						OTX.hmi.valueChangedInPage('ecu', ECUname);
						ECUname="";
					}
					OTX.hmi.closeScreen();
				});
				
				$("#response_back").click(function(e)
				{
					OTX.hmi.valueChangedInPage('back', 'true')
					OTX.hmi.closeScreen();
				});
			});
