<!--
 This page is displayed whenever a show document dialog is used in OTX.  It will display
 the referenced page in an iframe.
 -->

<!DOCTYPE html>
<html>
<head>
<title>Dynamic screen test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="jquery-1.9.1.min.js"></script>
<script src="jquery.mobile-1.3.0.min.js"></script>
<script src="js-url.min.js"></script>
<script src="otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<META http-equiv="Pragma" content="no-cache">
<META http-equiv="Expires" content="-1">

</head>

<body>
	<div data-role="page" id="mainPage">

		<header data-role="header">
			<h1 id="title">Example of Bargraph</h1>
		</header>

		<div data-role="content">
			<label style="font-size:18pt;" id="valueLabel" for="value"></label>
			<progress name="value" id="value" max="100"></progress>
			<span id="progressText" name="progressText" style="{font-size:16px;}">BANANA</span>
		</div>

		<div data-role="footer" data-position="fixed">
			<input type="button" id="setButton" data-role="button" value="Abort" style="{color:red;}"/>
		</div>

		<script type="text/javascript">
			var VALUE = 'value';
			var VALUE_NAME  = 'valueName';
			var LOWER_LIMIT = 'valueMin';
			var UPPER_LIMIT = 'valueMax';

			$('#mainPage').bind('pagebeforeshow', function(e, data) {
				$('#valueLabel').text(OTX.hmi.getArgument(VALUE_NAME));
				var meter = $('#value');
				meter.val(OTX.hmi.getArgument(VALUE));
				$('#progressText').empty().append(OTX.hmi.getArgument(VALUE));
				// meter.min(OTX.hmi.getArgument(LOWER_LIMIT));
				// meter.max(OTX.hmi.getArgument(UPPER_LIMIT));

				OTX.hmi.addValueListener('value', function(newValue) {
					$('#value').val(newValue);
					$('#progressText').empty().append(newValue);
				});
			});

			$('#setButton').click(function() {
				OTX.hmi.closeScreen();
			});

			$('#mainPage').bind('pageremove', function() {
				OTX.hmi.clearValueListeners();
			});

			</script>

	</div>



</body>
</html>
