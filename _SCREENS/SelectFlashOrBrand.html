<head>

<body>
	<div data-role="page" id="mainPage">	 
 		<p style="text-align:center"><font size=9><@gx_translate text_id="GX.COMMON.CPLF.PLS.SEL.BRANDORFLASH"/></font></p>
			
			<style type="text/css" scoped>
				#selectContainer {
					margin: 0 auto; 
					width: 450px;
					height: 170px;  
					#border: 1px solid #00F;
					margin-top: 10%;
				}
				#selbrand{
					float: left;
					width: 200px;
					height: 130px; 
					line-height: 130px;
					border: 1px solid #00F; 
					text-align: center;
					background: url('/images/vid.png') no-repeat center;
				}
				#selbrand:hover{
					#background: #C0C0C0;
					cursor: pointer;
				}
				
				#sellocalflash{
					float: right;
					width: 200px;
					height: 130px; 
					line-height: 130px;
					border: 1px solid #00F; 
					text-align: center;
					background: url('/images/ECUFlashing.png') no-repeat center;
				}
				#sellocalflash:hover{
					#background: #C0C0C0;
					cursor: pointer;
				}
			</style>
		<div data-role="content" id="selectContainer"> 
			<div id="selbrand"><div style="text-align: center; padding-top: 50px;"><@gx_translate text_id="GX.COMMON.CPLF.BRAND"/></div></div>
			<div id="sellocalflash"><div style="text-align: center; padding-top: 50px;"><@gx_translate text_id="GX.COMMON.CPLF.FLASH"/></div></div>
		</div>

					</div>

		</div>

		<!-- footer --> 
 
		<script type="text/javascript">	
			
			var g_model = '', g_ecu = '';
			var uploadFileList = [];
			$('#mainPage').bind('pageshow', function() { 				
				 			
			});  
												
			$("#selbrand").click(function(e) {
			 
				OTX.hmi.valueChangedInPage('selType', '1');//brand
				OTX.hmi.closeScreen(); 
			});
			
			$("#sellocalflash").click(function(e) {
			 
				OTX.hmi.valueChangedInPage('selType', '2');//flash
				OTX.hmi.closeScreen();
			});
						
		</script>
	</div>
</body>
</html>
