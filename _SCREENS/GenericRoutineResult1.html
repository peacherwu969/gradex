<!DOCTYPE html>
<html>
<head>
<title>Diagnostic Instruction Steps</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>

<body>
	<div data-role="page" id="mainPage" unselectable="on" onselectstart="return false;" style="-moz-user-select:none; -webkit-user-select:none; -ms-user-select:none; user-select:none;">

			<div data-role="header">
			<h1 id="title"></h1>
		</div>

		<div data-role="content">
			<h3 id="instruction"></h3>			
			<div><ul id="info"></ul><div> 
			<h3 id="subtitle"></h3>
			<div><h4><ul><li id="routineResult"></li></ul></h4><div> 
			<h3 id="subtitle1"></h3>
			<div><h4><ul><li id="routineResult1"></li></ul></h4><div>
			<h3 id="subtitle2"></h3>
			<div><h4><ul><li id="routineResult2"></li></ul></h4><div>
		</div>
		
	    <div data-role="footer" data-theme="c" data-position="fixed">
	    	<div>
				<fieldset class="ui-grid-b">
					<div class="ui-block-a"></div>
					<div class="ui-block-b"><button id="ok" data-corners="true" data-mini="false" data-icon="check" data-iconpos="left"><@gx_translate text_id="GX.COMMON.OK" /></button></div>

				</fieldset>
			</div>
        </div> <!-- footer -->

		<script type="text/javascript">

			// setup up screen for initial display

			$('#mainPage').bind('pageshow', function()
				{

					title = OTX.hmi.getArgument('title');
					subtitle = OTX.hmi.getArgument('subtitle');
					subtitle1 = OTX.hmi.getArgument('subtitle1');
					subtitle2 = OTX.hmi.getArgument('subtitle2');
					instruction = OTX.hmi.getArgument('instruction'); 
					info = OTX.hmi.getArgument('info'); 
					routineResult = OTX.hmi.getArgument('routineResult');
					routineResult1 = OTX.hmi.getArgument('routineResult1');
					routineResult2 = OTX.hmi.getArgument('routineResult2');

					$('#title').text(title);
					$('#instruction').text(instruction);
					$('#subtitle').text(subtitle);
					$('#subtitle1').text(subtitle1);
					$('#subtitle2').text(subtitle2);
					$('#routineResult').text(routineResult);
					$('#routineResult1').text(routineResult1);
					$('#routineResult2').text(routineResult2);
					
					var itemsString = "";

					for (var item=0; item < info.length; item++)
					{
					     itemsString = itemsString + "<li>" + info[item] + "</li>";
					}

					$('#info').html(itemsString);

				});

				OTX.hmi.addValueListener('routineResult', function(titleText)
				{
					$('#routineResult').text(titleText);
				});
				
				OTX.hmi.addValueListener('routineResult1', function(titleText)
				{
					$('#routineResult1').text(titleText);
				});
				
				OTX.hmi.addValueListener('routineResult2', function(titleText)
				{
					$('#routineResult2').text(titleText);
				});

				$("#ok").click(function(e)
				{
					OTX.hmi.closeScreen();
				});

		</script>
	</div>
</body>
</html>
