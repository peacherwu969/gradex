<!DOCTYPE html>
<html>
<head>
<title>Diagnostic Warning</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="common/jquery.mobile-1.3.0.min.css" />
<link rel="stylesheet" href="busy.css" />
<script src="common/jquery-1.9.1.min.js"></script>
<script src="common/jquery.mobile-1.3.0.min.js"></script>
<script src="common/js-url.min.js"></script>
<script src="common/otx.js"></script>
<meta http-equiv="X-UA-Compatible" content="IE=9" />
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="-1"/>
</head>

<body>
	<div data-role="page" id="mainPage" unselectable="on" onselectstart="return false;" style="-moz-user-select:none; -webkit-user-select:none; -ms-user-select:none; user-select:none;">

		
		<div data-role="header">
			<h1 id="title"></h1>
		</div>

		<div data-role="content">
				<h3 id="errortitle"></h3>
			<div><ul id="errorlist"><ul></div>
			<div id="cause_section" style="{display:none;}">
				<h3 id="causetitle"></h3>
				<ul id="causelist"><ul></div>
			<div id="solution_section" style="{display:none;}">
				<h3 id="solutiontitle"></h3>
				<ul id="solutionlist"><ul></div>
		</div>

	    <div data-role="footer" data-theme="c" data-position="fixed">
	    	<div>
				<fieldset class="ui-grid-b">
			    <div class="ui-block-a"></div>
					<div class="ui-block-b"><button id="ok" data-corners="true" data-mini="false" data-icon="check" data-iconpos="left"><@gx_translate text_id="GX.COMMON.OK" /></button></div>
				</fieldset>
			</div>
        </div> <!-- footer -->

		<script type="text/javascript">

			// setup up screen for initial display

			$('#mainPage').bind('pageshow', function()
				{

					title = OTX.hmi.getArgument('title');
					errortitle = OTX.hmi.getArgument('errortitle');
					causetitle = OTX.hmi.getArgument('causetitle');
					solutiontitle = OTX.hmi.getArgument('solutiontitle');
					causelist = OTX.hmi.getArgument('causelist');
					solutionlist = OTX.hmi.getArgument('solutionlist');
					errorlist = OTX.hmi.getArgument('errorlist');


					$('#title').text(title);
					$('#errortitle').text(errortitle);
					$('#causetitle').text(causetitle);
					$('#solutiontitle').text(solutiontitle);


					var errorString = "";

					for (var item=0; item < errorlist.length; item++)
					{
					     errorString = errorString + "<li>" + errorlist[item] + "</li>";
					}

					$('#errorlist').html(errorString);


					var itemsString = "";
					var itemsStringHtml = "";

					for (var item=0; item < causelist.length; item++)
					{
					     itemsString = itemsString + causelist[item];
					     itemsStringHtml = itemsStringHtml + "<li>" + causelist[item] + "</li>";
					}

					if ( itemsString.length > 0 )
					{
						$('#causelist').html(itemsStringHtml);
					}

					else
					{
						$('#cause_section').hide();
					}
					
					
					var additionalString = "";
					var additionalStringHtml = "";

					for (var item=0; item < solutionlist.length; item++)
					{
					     additionalString = additionalString + solutionlist[item];
					     additionalStringHtml = additionalStringHtml + "<li>" + solutionlist[item] + "</li>";
					}

					if ( additionalString.length > 0 )
					{
						$('#solutionlist').html(additionalStringHtml);
					}

					else
					{
						$('#solution_section').hide();
					}
					
				});


				$("#ok").click(function(e)
				{
					OTX.hmi.closeScreen();
				});
				


		</script>
	</div>
</body>
</html>
